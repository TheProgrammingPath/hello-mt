server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness and readiness probes (P5.4) and the smoke test (P2.5)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Inside Kubernetes, $hostname is the pod name
    location = /whoami {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "$hostname\n";
    }

    # Never cache the version or the per-environment config
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location /config/ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

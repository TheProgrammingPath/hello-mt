# P3.8: throwaway proof that GitHub reaches Azure with OIDC and no secret.
# Deleted before this branch is merged.
name: oidc-proof

on:
  workflow_dispatch:
  push:
    branches: [feat/tf-bootstrap]
    paths: [.github/workflows/oidc-proof.yml]

permissions:
  id-token: write
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login with OIDC (no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the dev resource group (should succeed)
        run: az group show -n rg-hello-mt-dev --query "{name:name, location:location, env:tags.env}" -o json

      - name: Read the prod resource group (should be denied)
        run: |
          if az group show -n rg-hello-mt-prod -o none 2>/dev/null; then
            echo "UNEXPECTED: the dev identity can read prod"
            exit 1
          fi
          echo "OK: the dev identity cannot read rg-hello-mt-prod (least privilege)"

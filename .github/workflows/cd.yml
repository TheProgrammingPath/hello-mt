# App CD: build once, deploy to dev and verify, then promote the same image to prod after approval (P7.1-P7.4).
name: cd

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Dockerfile"
      - "k8s/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  REGISTRY: crhellomt.azurecr.io
  IMAGE: crhellomt.azurecr.io/hello:${{ github.sha }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (dev identity, OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name crhellomt

      - uses: docker/setup-buildx-action@v3

      - name: Build and push once, tagged with the commit SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      BASE_URL: http://hello-dev.48.206.54.156.nip.io
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (dev identity, OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Get AKS credentials (Entra ID, no local accounts)
        run: |
          az aks get-credentials -g rg-hello-mt-dev -n aks-hello-mt-dev --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Deploy
        id: deploy
        run: scripts/deploy.sh dev "$GITHUB_SHA"

      - name: Smoke test
        id: smoke
        run: scripts/smoke.sh "$BASE_URL" "$GITHUB_SHA"

      - name: Roll back if deploy or smoke test failed
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          kubectl rollout undo deployment/hello -n hello
          kubectl rollout status deployment/hello -n hello --timeout 5m

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed to dev"
            echo "- Image: $IMAGE"
            echo "- URL: $BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      BASE_URL: http://hello-prod.20.242.237.48.nip.io
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (prod identity, OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Image must already exist (never rebuild for prod)
        run: |
          tags="$(az acr repository show-tags -n crhellomt --repository hello -o tsv)"
          if grep -qx "$GITHUB_SHA" <<< "$tags"; then
            echo "Found hello:$GITHUB_SHA in ACR. Promoting it, no build."
          else
            echo "::error::hello:$GITHUB_SHA is not in ACR. Prod never builds; deploy to dev first."
            exit 1
          fi

      - uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Get AKS credentials (Entra ID, no local accounts)
        run: |
          az aks get-credentials -g rg-hello-mt-prod -n aks-hello-mt-prod --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Deploy
        id: deploy
        run: scripts/deploy.sh prod "$GITHUB_SHA"

      - name: Smoke test
        id: smoke
        run: scripts/smoke.sh "$BASE_URL" "$GITHUB_SHA"

      - name: Roll back if deploy or smoke test failed
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          kubectl rollout undo deployment/hello -n hello
          kubectl rollout status deployment/hello -n hello --timeout 5m

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed to prod"
            echo "- Image: $IMAGE"
            echo "- URL: $BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

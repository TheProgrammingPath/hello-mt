# Infra CI: runs on every PR; checks and plans dev + prod only when infra changed (P6.5, P6.8).
name: terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did this PR touch infra?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$files"
          if grep -qE '^(infra/|\.tflint\.hcl$|\.github/workflows/terraform\.yml$)' <<< "$files"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  trivy-config:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan (infra/)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1 config \
            --exit-code 1 --severity CRITICAL /src/infra

  plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - name: terraform fmt -check
        run: terraform fmt -check -recursive "$GITHUB_WORKSPACE/infra"

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --call-module-type=all

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: Post plan to job summary
        if: always()
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          {
            echo "### Terraform plan: $ENV_NAME"
            echo '```'
            if [ -f plan.txt ]; then tail -c 60000 plan.txt; else echo "no plan output"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan-ok:
    needs: [changes, trivy-config, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Infra checks passed, or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an infra check did not pass ($r)"; exit 1 ;;
            esac
          done

# Runs the site's pods and replaces them safely during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels:
    app: hello
    spec:
      securityContext:
        runAsNonRoot: true             # refuse to start if the image would run as root
        seccompProfile:
          type: RuntimeDefault         # the container runtime's default syscall filter
      containers:
        - name: hello
          image: hello
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:                  # what the scheduler reserves; the HPA measures CPU against this
              cpu: 50m
              memory: 64Mi
            limits:                    # hard ceiling; over the memory limit = OOMKilled
              cpu: 200m
              memory: 128Mi
          readinessProbe:              # not Ready = removed from the Service (no traffic)
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:               # failing repeatedly = container restarted
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true      # nothing in the image can be modified at runtime
            allowPrivilegeEscalation: false   # no setuid tricks to gain privileges
            capabilities:
              drop: ["ALL"]                   # no Linux capabilities at all
          volumeMounts:
            - name: tmp
              mountPath: /tmp          # nginx needs a writable /tmp (pid file, temp files)
      volumes:
        - name: tmp
          emptyDir: {}                 # scratch space that lives as long as the pod
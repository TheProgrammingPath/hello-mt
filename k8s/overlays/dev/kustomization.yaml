apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello
resources:
  - ../../base

images:
  - name: hello
    newName: crhellomt.azurecr.io/hello
    newTag: set-by-deploy-script

configMapGenerator:
  - name: hello-config
    files:
      - env.json

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: hello
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Ingress
      name: hello
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: hello-dev.48.206.54.156.nip.io
